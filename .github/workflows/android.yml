# Builds the offline Android app (APK) from the website on every push to main,
# and publishes it at: https://github.com/atindahhillary/enkaji-play/releases/download/app-latest/enkaji-play.apk
# Signing key: repository secrets KEYSTORE_B64 (base64 PKCS#12) and KEYSTORE_PASS. The key is never
# created or stored by this workflow; the build stops if the secrets are missing.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle the website into the app
        run: |
          W=android/app/src/main/assets/www
          mkdir -p "$W" android/app/src/main/res/mipmap-xxxhdpi
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android' --exclude 'tools' \
            --exclude 'check.js' --exclude 'voice/review.html' --exclude 'voice/script.html' --exclude '.vercel*' --exclude '*.md' ./ "$W/"
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          du -sh "$W"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Build and sign the APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "Signing secrets KEYSTORE_B64 / KEYSTORE_PASS are missing. Add them in the repository settings." >&2
            exit 1
          fi
          export KEYSTORE_FILE="$RUNNER_TEMP/enkaji-signing.p12" KEY_ALIAS=enkaji
          echo "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          gradle -p android assembleRelease --no-daemon
          rm -f "$KEYSTORE_FILE"

      - name: Publish to the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk enkaji-play.apk
          ls -la enkaji-play.apk
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --target "$GITHUB_SHA" \
            --title "Enkaji Play for Android" \
            --notes "Offline Android app. Download enkaji-play.apk, open it on the phone and allow installing from this source. Share it by Bluetooth or Xender, no internet needed."
          gh release upload app-latest enkaji-play.apk --clobber
