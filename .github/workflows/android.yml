# Builds the offline Android app (APK) from the website on every push to main,
# and publishes it at: https://github.com/atindahhillary/enkaji-play/releases/download/app-latest/enkaji-play.apk
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bundle the website into the app
        run: |
          W=android/app/src/main/assets/www
          mkdir -p "$W" android/app/src/main/res/mipmap-xxxhdpi
          rsync -a --exclude '.git' --exclude '.github' --exclude 'android' --exclude 'tools' \
            --exclude 'check.js' --exclude 'voice/review.html' --exclude '.vercel*' --exclude '*.md' ./ "$W/"
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          du -sh "$W"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/enkaji.jks"
            echo "KEYSTORE_PASS=$KEYSTORE_PASS_SECRET" >> "$GITHUB_ENV"
          else
            # First build only: make a key and keep it as a private artifact, so it can be
            # saved as repository secrets. Later builds then sign with the same key and
            # phones can update the app without uninstalling.
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/enkaji.jks" -alias enkaji -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Enkaji Play, O=Enkaji Play, C=KE"
            mkdir -p "$RUNNER_TEMP/key" && cp "$RUNNER_TEMP/enkaji.jks" "$RUNNER_TEMP/key/" && echo "$PASS" > "$RUNNER_TEMP/key/password.txt"
            echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "NEW_KEY=1" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/enkaji.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=enkaji" >> "$GITHUB_ENV"

      - name: Keep the new signing key (first build only)
        if: env.NEW_KEY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-keep-private
          path: ${{ runner.temp }}/key/
          retention-days: 30

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish to the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk enkaji-play.apk
          ls -la enkaji-play.apk
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --target "$GITHUB_SHA" \
            --title "Enkaji Play for Android" \
            --notes "Offline Android app. Download enkaji-play.apk, open it on the phone and allow installing from this source. Share it by Bluetooth or Xender, no internet needed."
          gh release upload app-latest enkaji-play.apk --clobber
