<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Enkaji 3D studio</title>
<style>body{font-family:Inter,system-ui;background:#eee;margin:16px}#out{display:flex;flex-wrap:wrap;gap:10px}#out figure{margin:0;background:#fff;padding:6px;border-radius:12px;text-align:center;font-size:12px}#out img{width:160px;height:160px;object-fit:contain;background:repeating-conic-gradient(#f3f3f3 0 25%,#fff 0 50%) 0 0/16px 16px}</style></head>
<body><h1>Enkaji 3D studio</h1><p id="status">Rendering...</p><div id="out"></div>
<script type="module">
// Renders every character and animal once to a transparent WebP, then POSTs it to tools/serve.js,
// which writes assets/<name>.webp. Re-run this page whenever a model in models.js changes.
import { THREE, person, cow, sheep, goat, lights } from '../models.js';
import { STORY_COVERS } from '../story3d.js';

const W = 512;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, W); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

function shoot(obj, eye, target, fov = 30, w = W, h = W) {
  const scene = new THREE.Scene(); lights(scene, 'day'); scene.add(obj);
  const cam = new THREE.PerspectiveCamera(fov, w / h, .05, 100); cam.position.set(...eye); cam.lookAt(...target);
  renderer.setSize(w, h); renderer.setClearColor(0x000000, 0); renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/webp', .88);
}
// Head-and-shoulders: frame on the head wherever the model puts it.
function portrait(p) {
  const h = new THREE.Vector3(); p.updateMatrixWorld(true); p.userData.head.getWorldPosition(h);
  const k = p.scale.x < 1 ? .8 : 1;
  return shoot(p, [h.x + .35 * k, h.y + .05, h.z + 1.25 * k], [h.x, h.y - .16 * k, h.z], 30);
}
function fit(obj, dir, fov = 32) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), r = box.getBoundingSphere(new THREE.Sphere()).radius;
  const d = r / Math.sin(fov * Math.PI / 360) * 1.02, v = new THREE.Vector3(...dir).normalize();
  return shoot(obj, [c.x + v.x * d, c.y + v.y * d, c.z + v.z * d], [c.x, c.y, c.z], fov);
}
const COATS = { brown: ['#8d5524'], white: ['#f2efe6', { muzzle: '#e8c4b0' }], black: ['#2b1d16'], red: ['#a8471f'], grey: ['#9e9e9e'],
  spotted: ['#f2efe6', { patch: '#3e2723', patches: [[.1, 1.0, .25, .16], [-.25, .85, -.25, .14], [.25, .8, .28, .1]] }] };
const JOBS = [
  ['av-girl', () => portrait(person({ kind: 'girl', wrap: '#1E88E5', collar: ['#FDD835', '#ffffff', '#E53935'] }))],
  ['av-boy', () => portrait(person({ kind: 'boy', wrap: '#E53935', collar: ['#1E88E5', '#ffffff'] }))],
  ['av-mama', () => portrait(person({ kind: 'woman', wrap: '#c62828' }))],
  ['av-koko', () => portrait(person({ kind: 'elder', wrap: '#0277BD', collar: ['#ffffff', '#E53935', '#43A047', '#FDD835'] }))],
  ['av-ruth', () => portrait(person({ kind: 'woman', wrap: '#E53935', collar: ['#1E88E5', '#ffffff', '#FDD835'] }))],
  ['av-man', () => portrait(person({ kind: 'man', wrap: '#1565C0', collar: ['#E53935', '#ffffff'] }))],
  ['av-soil', () => portrait(person({ kind: 'man', wrap: '#6d4c41', collar: ['#E53935', '#ffffff', '#1E88E5'] }))],
  ['av-it', () => portrait(person({ kind: 'man', wrap: '#1E88E5', collar: ['#FDD835', '#ffffff', '#E53935'] }))],
  ['av-health', () => portrait(person({ kind: 'woman', wrap: '#00897B', collar: ['#E53935', '#ffffff', '#43A047'] }))],
  ['av-schol', () => portrait(person({ kind: 'woman', wrap: '#0277BD', collar: ['#FB8C00', '#ffffff', '#E53935'] }))],
  ['av-agri', () => portrait(person({ kind: 'man', wrap: '#43A047', collar: ['#E53935', '#FDD835', '#1E88E5'] }))],
  ['kerri', () => { const s = sheep({ mascot: true }); s.rotation.y = -.7; return fit(s, [.3, .35, 1]); }],
  ['goat', () => { const g = goat(); g.rotation.y = -.5; return fit(g, [.2, .3, 1]); }],
  ...Object.entries(COATS).map(([k, [c, o]]) => [`cow-${k}`, () => { const m = cow(c, o); m.rotation.y = -.4; return fit(m, [.15, .25, 1]); }]),
  ...Object.entries(STORY_COVERS).map(([id, build]) => [`cover-${id}`, () => { const { scene, cam } = build(); renderer.setSize(640, 360); renderer.setClearColor(0, 1); renderer.render(scene, cam); return renderer.domElement.toDataURL('image/webp', .82); }]),
];

const out = document.getElementById('out');
let ok = 0;
for (const [name, job] of JOBS) {
  const url = job();
  out.insertAdjacentHTML('beforeend', `<figure><img src="${url}" alt="${name}"><figcaption>${name}</figcaption></figure>`);
  const res = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: url }).catch(() => null);
  if (res && res.ok) ok++;
}
document.getElementById('status').textContent = `Done: ${JOBS.length} renders, ${ok} saved to assets/.`;
window.STUDIO_DONE = { total: JOBS.length, saved: ok };
</script></body></html>
